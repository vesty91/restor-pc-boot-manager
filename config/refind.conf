# Restor-PC Boot Manager - rEFInd configuration template
timeout 8
default_selection "WIN CODE / WIN VESTY"
use_graphics_for windows,linux
resolution 1920 1080
hideui hints,arrows,badges
icons_dir icons

# Existing Windows and recovery volumes are excluded from automatic scanning.
# The Windows boot manager is exposed once through the manual entry below.
# New Linux volumes remain eligible for automatic detection.
scanfor internal,external,manual
also_scan_dirs EFI/ubuntu,EFI/Linux
dont_scan_volumes {{WINDOWS_VOLUME_GUIDS}}
dont_scan_files shim.efi,MokManager.efi,mmx64.efi,fbx64.efi,BOOTX64.EFI,refind_x64.efi,bootmgfw.efi,bootmgr.efi,memtest.efi,winload.efi

menuentry "WIN CODE / WIN VESTY" {
    icon themes\restor-pc\assets\os_windows.png
    volume {{WINDOWS_ESP_GUID}}
    loader \EFI\Microsoft\Boot\bootmgfw.efi
}

# Restor-PC theme
include themes/restor-pc/theme.conf
