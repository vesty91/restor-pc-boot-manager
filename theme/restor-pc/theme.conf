# Restor-PC theme for rEFInd
banner themes/restor-pc/assets/background.png
banner_scale fillscreen
selection_big themes/restor-pc/assets/selection_big.png
selection_small themes/restor-pc/assets/selection_small.png
big_icon_size 176
small_icon_size 56
showtools shell,memtest,gdisk,about,reboot,shutdown,firmware
textonly false

# Keep the selected loader label visible.
hideui hints,arrows,badges
