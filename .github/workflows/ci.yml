name: RESTOR-PC CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restor-pc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned test tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ("PowerShell : " + $PSVersionTable.PSVersion)
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $versions = Import-PowerShellDataFile .\config\ToolVersions.psd1
          Install-Module -Name PSScriptAnalyzer -RequiredVersion $versions.PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
          Install-Module -Name Pester -RequiredVersion $versions.Pester -Scope CurrentUser -Force -AllowClobber
          Get-Module PSScriptAnalyzer -ListAvailable |
            Where-Object { $_.Version -eq [version]$versions.PSScriptAnalyzer } |
            Sort-Object Version -Descending |
            Select-Object -First 1 |
            Format-List Name, Version
          Get-Module Pester -ListAvailable |
            Where-Object { $_.Version -eq [version]$versions.Pester } |
            Sort-Object Version -Descending |
            Select-Object -First 1 |
            Format-List Name, Version

      - name: Validate repository
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\Test-Repository.ps1
